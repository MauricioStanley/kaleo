<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sun terrace de Kaleo con tumbonas al atardecer">
  <defs>
    <linearGradient id="trSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7c9a6"/><stop offset=".4" stop-color="#e6d3bd"/><stop offset="1" stop-color="#d8dfce"/>
    </linearGradient>
    <radialGradient id="trSun" cx="26%" cy="34%" r="46%">
      <stop offset="0" stop-color="#f6e6cb" stop-opacity=".95"/><stop offset="1" stop-color="#f6e6cb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trDeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c2ac"/><stop offset="1" stop-color="#a89f86"/>
    </linearGradient>
    <filter id="trGrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#trSky)"/>
  <circle cx="420" cy="410" r="420" fill="url(#trSun)"/>
  <circle cx="420" cy="410" r="70" fill="#f7ead0"/>
  <!-- distant volcano / skyline strip -->
  <path d="M0 620 L360 470 L620 600 L960 500 L1240 610 L1600 540 V700 H0 Z" fill="#8ea389" opacity=".8"/>
  <path d="M0 660 H1600 V700 H0 Z" fill="#7b9078" opacity=".6"/>
  <!-- deck -->
  <path d="M0 690 H1600 V1200 H0 Z" fill="url(#trDeck)"/>
  <g stroke="#b7ae94" stroke-width="4"><path d="M0 800 H1600"/><path d="M0 930 H1600"/><path d="M0 1070 H1600"/></g>
  <!-- parapet -->
  <rect x="0" y="662" width="1600" height="30" fill="#ded7c2"/>
  <!-- loungers -->
  <g fill="#3f5540">
    <path d="M360 760 l260 -14 8 40 -260 14 z"/>
    <path d="M360 760 l-8 90 40 4 22 -84 z"/>
    <path d="M600 742 l70 -30 14 34 -70 30 z"/>
  </g>
  <g fill="#4c6449">
    <path d="M980 780 l260 -14 8 40 -260 14 z"/>
    <path d="M980 780 l-8 90 40 4 22 -84 z"/>
    <path d="M1220 762 l70 -30 14 34 -70 30 z"/>
  </g>
  <!-- potted plants -->
  <g fill="#2f3f2d"><ellipse cx="120" cy="640" rx="90" ry="70"/><rect x="96" y="650" width="52" height="70" fill="#7c6a53"/></g>
  <g fill="#2f3f2d"><ellipse cx="1500" cy="650" rx="80" ry="64"/><rect x="1478" y="660" width="48" height="66" fill="#7c6a53"/></g>
  <rect width="1600" height="1200" filter="url(#trGrain)"/>
</svg>
