<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Barra de la cafeteria de Kaleo con metodos de filtrado y grano para llevar">
  <defs>
    <linearGradient id="cfWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe8d8"/><stop offset="1" stop-color="#ddd4bf"/></linearGradient>
    <linearGradient id="cfWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7cbac"/><stop offset="1" stop-color="#5e7c58"/></linearGradient>
    <linearGradient id="cfBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a7458"/><stop offset="1" stop-color="#5f4e3a"/></linearGradient>
    <radialGradient id="cfGlow" cx="24%" cy="20%" r="60%"><stop offset="0" stop-color="#f6ecd2" stop-opacity=".6"/><stop offset="1" stop-color="#f6ecd2" stop-opacity="0"/></radialGradient>
    <filter id="cfGrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#cfWall)"/>
  <!-- window left -->
  <rect x="90" y="150" width="360" height="520" fill="url(#cfWin)"/>
  <rect x="90" y="150" width="360" height="520" fill="none" stroke="#cec5ad" stroke-width="16"/>
  <line x1="270" y1="150" x2="270" y2="670" stroke="#cec5ad" stroke-width="10"/>
  <rect width="1600" height="1200" fill="url(#cfGlow)"/>
  <!-- back shelf with coffee bags -->
  <rect x="560" y="230" width="900" height="260" fill="#cdbf9f"/>
  <g stroke="#a68f6b" stroke-width="8"><path d="M560 320 H1460"/><path d="M560 410 H1460"/></g>
  <g fill="#6f5e46"><rect x="600" y="256" width="46" height="58"/><rect x="660" y="250" width="40" height="64"/><rect x="716" y="262" width="52" height="52"/><rect x="820" y="252" width="44" height="62"/></g>
  <g fill="#8a7458"><rect x="600" y="344" width="52" height="60"/><rect x="670" y="348" width="46" height="56"/><rect x="1180" y="342" width="60" height="62"/><rect x="1280" y="346" width="52" height="58"/></g>
  <!-- bar counter -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#cfBar)"/>
  <rect x="0" y="640" width="1600" height="16" fill="#9c855f"/>
  <!-- pour-over drippers -->
  <g transform="translate(360 560)">
    <path d="M0 0 h120 l-24 70 h-72 z" fill="#e7ddc7"/>
    <path d="M20 80 h80 v6 h-80 z" fill="#8a8068"/><ellipse cx="60" cy="150" rx="70" ry="20" fill="#efe9dc"/>
  </g>
  <g transform="translate(560 560)">
    <path d="M0 0 h120 l-24 70 h-72 z" fill="#e7ddc7"/>
    <path d="M20 80 h80 v6 h-80 z" fill="#8a8068"/><ellipse cx="60" cy="150" rx="70" ry="20" fill="#efe9dc"/>
  </g>
  <!-- espresso machine block -->
  <rect x="900" y="520" width="300" height="130" rx="10" fill="#3f4a39"/>
  <rect x="930" y="560" width="60" height="10" fill="#caa876"/>
  <rect x="1110" y="560" width="60" height="10" fill="#caa876"/>
  <circle cx="1020" cy="585" r="10" fill="#e7ddc7"/>
  <!-- cups on counter -->
  <g><ellipse cx="300" cy="770" rx="46" ry="16" fill="#efe9dc"/><path d="M262 762 q0 34 38 40 q38 -6 38 -40 z" fill="#e0d8c4"/><path d="M342 758 q34 6 30 34 q-6 20 -30 14z" fill="none" stroke="#cbbfa6" stroke-width="8"/></g>
  <g><ellipse cx="470" cy="800" rx="40" ry="14" fill="#efe9dc"/><path d="M436 794 q0 30 34 36 q34 -6 34 -36 z" fill="#e0d8c4"/></g>
  <!-- steam -->
  <g stroke="#d8d2bf" stroke-width="4" fill="none" opacity=".6"><path d="M300 720 q10 -24 -4 -48 q-10 -18 4 -40"/><path d="M470 758 q10 -20 -4 -40"/></g>
  <!-- plant -->
  <g fill="#33472f"><ellipse cx="1400" cy="740" rx="90" ry="120"/><rect x="1368" y="800" width="62" height="80" fill="#6f5e46"/></g>
  <rect width="1600" height="1200" filter="url(#cfGrain)"/>
</svg>
