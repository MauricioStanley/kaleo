<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Calle arbolada de Colonia San Benito, San Salvador">
  <defs>
    <linearGradient id="stSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9cdb2"/><stop offset=".55" stop-color="#d7e0cd"/><stop offset="1" stop-color="#eef0e8"/>
    </linearGradient>
    <linearGradient id="stRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7568"/><stop offset="1" stop-color="#454b41"/>
    </linearGradient>
    <filter id="stGrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#stSky)"/>
  <!-- distant wall -->
  <rect x="0" y="470" width="1600" height="220" fill="#e7e3d4"/>
  <rect x="0" y="470" width="1600" height="12" fill="#d2cdba"/>
  <!-- sidewalk + road perspective -->
  <path d="M0 690 H1600 V1200 H0 Z" fill="#cdc9b8"/>
  <path d="M420 690 L720 1200 H0 V1050 Z" fill="url(#stRoad)"/>
  <path d="M420 690 L720 1200 H1180 L900 690 Z" fill="#565d50"/>
  <g stroke="#cfd3c4" stroke-width="10" stroke-dasharray="46 60"><path d="M655 700 L400 1200"/></g>
  <!-- tree canopies overhead -->
  <g fill="#33472f">
    <ellipse cx="180" cy="240" rx="330" ry="260"/>
    <ellipse cx="1440" cy="210" rx="360" ry="280"/>
    <ellipse cx="800" cy="120" rx="380" ry="240"/>
  </g>
  <g fill="#2c3c2a" opacity=".55"><path d="M0 300 Q 400 460 820 360 T 1600 380 V0 H0 Z"/></g>
  <!-- trunks -->
  <g fill="#3f4a39">
    <rect x="250" y="360" width="34" height="330"/>
    <rect x="1300" y="330" width="40" height="360"/>
  </g>
  <!-- dappled light on road -->
  <g fill="#f2ead4" opacity=".22"><ellipse cx="540" cy="900" rx="120" ry="34"/><ellipse cx="410" cy="1090" rx="150" ry="40"/><ellipse cx="720" cy="800" rx="90" ry="26"/></g>
  <!-- foreground leaves -->
  <g fill="#25331f"><path d="M-20 0 C 160 120 120 260 260 340 C 120 200 180 60 60 0 Z"/><path d="M1620 0 C 1460 130 1520 280 1380 360 C 1520 200 1460 60 1560 0 Z"/></g>
  <rect width="1600" height="1200" filter="url(#stGrain)"/>
</svg>
