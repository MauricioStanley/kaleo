<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Suite Kaleo con dormitorio King, sala de estar y terraza privada sobre el jardin">
  <defs>
    <linearGradient id="suWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0e9d9"/><stop offset="1" stop-color="#dbd2bd"/></linearGradient>
    <linearGradient id="suFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b79a"/><stop offset="1" stop-color="#9d8968"/></linearGradient>
    <linearGradient id="suWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aac0a2"/><stop offset=".6" stop-color="#79996f"/><stop offset="1" stop-color="#587653"/></linearGradient>
    <radialGradient id="suGlow" cx="50%" cy="0%" r="95%"><stop offset="0" stop-color="#f6ecd2" stop-opacity=".7"/><stop offset="1" stop-color="#f6ecd2" stop-opacity="0"/></radialGradient>
    <filter id="suGrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#suWall)"/>
  <rect x="0" y="850" width="1600" height="350" fill="url(#suFloor)"/>
  <rect x="0" y="845" width="1600" height="10" fill="#8d7a5b"/>
  <!-- full-height terrace glazing across back -->
  <rect x="620" y="110" width="940" height="640" fill="url(#suWin)"/>
  <rect x="620" y="110" width="940" height="640" fill="none" stroke="#cec5ad" stroke-width="18"/>
  <line x1="930" y1="110" x2="930" y2="750" stroke="#cec5ad" stroke-width="12"/>
  <line x1="1245" y1="110" x2="1245" y2="750" stroke="#cec5ad" stroke-width="12"/>
  <rect x="620" y="110" width="940" height="640" fill="url(#suGlow)"/>
  <!-- garden hint through glass -->
  <g fill="#4a6644" opacity=".5"><ellipse cx="1120" cy="360" rx="380" ry="200"/><ellipse cx="780" cy="520" rx="200" ry="140"/></g>
  <!-- king bed left -->
  <rect x="90" y="360" width="620" height="250" rx="16" fill="#c3b291"/>
  <rect x="60" y="590" width="700" height="270" fill="#f3efe4"/>
  <path d="M60 590 h700 v84 q-350 44 -700 0 z" fill="#e6dfce"/>
  <rect x="90" y="676" width="300" height="100" rx="12" fill="#dbd3bf"/>
  <rect x="410" y="676" width="300" height="100" rx="12" fill="#dbd3bf"/>
  <rect x="60" y="852" width="700" height="26" fill="#8d7a5b"/>
  <rect x="740" y="700" width="90" height="160" fill="#7d6a51"/>
  <path d="M762 612 l40 0 14 88 -68 0 z" fill="#e9dcc0"/>
  <!-- sitting area foreground right -->
  <rect x="1000" y="720" width="380" height="150" rx="20" fill="#4c6449"/>
  <rect x="1000" y="676" width="380" height="70" rx="22" fill="#3f5540"/>
  <rect x="1090" y="880" width="200" height="64" rx="12" fill="#7d6a51"/>
  <circle cx="1190" cy="898" r="18" fill="#a86a44"/>
  <!-- floor lamp -->
  <rect x="1450" y="560" width="10" height="320" fill="#6f5e46"/>
  <path d="M1420 520 h70 l18 60 h-106 z" fill="#e9dcc0"/>
  <circle cx="1455" cy="560" r="90" fill="#f4ecd6" opacity=".3"/>
  <!-- plant + light pool -->
  <g fill="#33472f"><ellipse cx="940" cy="800" rx="80" ry="120"/><rect x="912" y="860" width="56" height="70" fill="#6f5e46"/></g>
  <ellipse cx="1150" cy="1000" rx="300" ry="60" fill="#f4ead0" opacity=".4"/>
  <rect width="1600" height="1200" filter="url(#suGrain)"/>
</svg>
