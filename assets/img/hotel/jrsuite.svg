<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Jr. Suite de Kaleo con zona de estar y salida a la sun terrace">
  <defs>
    <linearGradient id="jsWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe8d8"/><stop offset="1" stop-color="#dcd3be"/></linearGradient>
    <linearGradient id="jsFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b79a"/><stop offset="1" stop-color="#a08c6c"/></linearGradient>
    <linearGradient id="jsWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aac0a2"/><stop offset="1" stop-color="#5c7a56"/></linearGradient>
    <radialGradient id="jsGlow" cx="70%" cy="6%" r="90%"><stop offset="0" stop-color="#f6ecd2" stop-opacity=".72"/><stop offset="1" stop-color="#f6ecd2" stop-opacity="0"/></radialGradient>
    <filter id="jsGrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#jsWall)"/>
  <rect x="0" y="860" width="1600" height="340" fill="url(#jsFloor)"/>
  <rect x="0" y="855" width="1600" height="10" fill="#8f7c5d"/>
  <!-- terrace doors right -->
  <rect x="1150" y="120" width="410" height="700" fill="url(#jsWin)"/>
  <rect x="1150" y="120" width="410" height="700" fill="none" stroke="#cec5ad" stroke-width="18"/>
  <line x1="1355" y1="120" x2="1355" y2="820" stroke="#cec5ad" stroke-width="12"/>
  <rect x="1150" y="120" width="410" height="700" fill="url(#jsGlow)"/>
  <!-- bed left -->
  <rect x="120" y="420" width="560" height="210" rx="14" fill="#c3b291"/>
  <rect x="96" y="612" width="620" height="240" fill="#f3efe4"/>
  <path d="M96 612 h620 v72 q-310 38 -620 0 z" fill="#e6dfce"/>
  <rect x="120" y="686" width="260" height="90" rx="12" fill="#dbd3bf"/>
  <rect x="96" y="842" width="620" height="24" fill="#8f7c5d"/>
  <rect x="720" y="700" width="90" height="150" fill="#7d6a51"/>
  <path d="M742 616 l38 0 14 84 -66 0 z" fill="#e9dcc0"/>
  <!-- sitting area: sofa + coffee table -->
  <rect x="820" y="640" width="330" height="150" rx="18" fill="#4c6449"/>
  <rect x="820" y="600" width="330" height="70" rx="20" fill="#3f5540"/>
  <rect x="905" y="800" width="180" height="60" rx="10" fill="#7d6a51"/>
  <circle cx="995" cy="815" r="16" fill="#a86a44"/>
  <!-- plant + light pool -->
  <g fill="#33472f"><ellipse cx="1080" cy="770" rx="80" ry="120"/><rect x="1050" y="830" width="58" height="70" fill="#6f5e46"/></g>
  <ellipse cx="1240" cy="960" rx="260" ry="58" fill="#f4ead0" opacity=".4"/>
  <rect width="1600" height="1200" filter="url(#jsGrain)"/>
</svg>
