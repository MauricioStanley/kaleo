<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Jardin de Kaleo al atardecer con hamacas entre los arboles">
  <defs>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c5340"/>
      <stop offset=".42" stop-color="#5f7d5c"/>
      <stop offset=".72" stop-color="#9db894"/>
      <stop offset="1" stop-color="#d9e0cf"/>
    </linearGradient>
    <radialGradient id="hSun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4e2c6" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#e7c79f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e7c79f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3f31"/>
      <stop offset="1" stop-color="#1f2a21"/>
    </linearGradient>
    <filter id="hGrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#hSky)"/>
  <circle cx="1120" cy="430" r="360" fill="url(#hSun)"/>
  <circle cx="1120" cy="430" r="66" fill="#f4e2c6" opacity=".9"/>

  <!-- canopy silhouettes -->
  <g fill="#33472f" opacity=".9">
    <ellipse cx="230" cy="180" rx="360" ry="230"/>
    <ellipse cx="560" cy="90" rx="300" ry="200"/>
    <ellipse cx="1470" cy="150" rx="380" ry="250"/>
  </g>
  <g fill="#2a3a28">
    <path d="M0 470 Q 220 380 430 460 T 900 450 T 1600 470 V1000 H0 Z"/>
  </g>

  <!-- trunks -->
  <g fill="#243425">
    <rect x="360" y="300" width="34" height="360"/>
    <rect x="1180" y="300" width="40" height="380"/>
  </g>

  <!-- hammock -->
  <path d="M394 360 C 620 470 960 470 1200 380" stroke="#c9d8c2" stroke-width="10" fill="none" opacity=".9"/>
  <path d="M420 372 C 640 500 940 500 1176 392 L1176 392 C 940 470 640 470 420 372 Z" fill="#b9c9b2" opacity=".55"/>

  <rect width="1600" height="1000" fill="url(#hGround)" opacity="0" />
  <path d="M0 640 Q 400 560 820 610 T 1600 590 V1000 H0 Z" fill="url(#hGround)"/>
  <path d="M0 780 Q 500 720 1000 770 T 1600 760 V1000 H0 Z" fill="#182018"/>

  <!-- foreground fronds -->
  <g fill="#1c2a1c">
    <path d="M-20 1000 C 120 780 60 640 200 560 C 140 720 220 860 300 1000 Z"/>
    <path d="M1620 1000 C 1500 800 1560 640 1430 560 C 1520 740 1440 880 1360 1000 Z"/>
  </g>

  <rect width="1600" height="1000" filter="url(#hGrain)"/>
</svg>
