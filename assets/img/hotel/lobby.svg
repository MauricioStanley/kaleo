<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Recepcion de Kaleo con madera y plantas">
  <defs>
    <linearGradient id="lbWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe8d8"/><stop offset="1" stop-color="#ddd4bf"/></linearGradient>
    <linearGradient id="lbFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b79a"/><stop offset="1" stop-color="#a08c6c"/></linearGradient>
    <linearGradient id="lbWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb898"/><stop offset="1" stop-color="#5f7d59"/></linearGradient>
    <radialGradient id="lbGlow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#f6ecd2" stop-opacity=".7"/><stop offset="1" stop-color="#f6ecd2" stop-opacity="0"/></radialGradient>
    <filter id="lbGrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#lbWall)"/>
  <rect x="0" y="820" width="1600" height="380" fill="url(#lbFloor)"/>
  <rect x="0" y="815" width="1600" height="10" fill="#8f7c5d"/>
  <!-- window -->
  <rect x="1120" y="150" width="420" height="560" fill="url(#lbWin)"/>
  <rect x="1120" y="150" width="420" height="560" fill="none" stroke="#c9c0a8" stroke-width="16"/>
  <line x1="1330" y1="150" x2="1330" y2="710" stroke="#c9c0a8" stroke-width="10"/>
  <line x1="1120" y1="430" x2="1540" y2="430" stroke="#c9c0a8" stroke-width="10"/>
  <rect x="1120" y="150" width="420" height="560" fill="url(#lbGlow)"/>
  <!-- pendant lights -->
  <g stroke="#7c6a53" stroke-width="4"><path d="M360 150 V250"/><path d="M560 150 V220"/></g>
  <circle cx="360" cy="270" r="30" fill="#e9dcc0"/><circle cx="560" cy="240" r="24" fill="#e9dcc0"/>
  <circle cx="360" cy="270" r="70" fill="#f4ecd6" opacity=".35"/>
  <!-- reception desk -->
  <rect x="180" y="640" width="620" height="210" fill="#7d6a51"/>
  <rect x="180" y="640" width="620" height="26" fill="#8f7c5d"/>
  <rect x="180" y="820" width="620" height="30" fill="#5f5039"/>
  <!-- shelf behind -->
  <rect x="230" y="360" width="360" height="240" fill="#cdbf9f"/>
  <g stroke="#a68f6b" stroke-width="8"><path d="M230 440 H590"/><path d="M230 520 H590"/></g>
  <g fill="#6f5e46"><rect x="250" y="392" width="20" height="44"/><rect x="286" y="386" width="16" height="50"/><rect x="320" y="398" width="24" height="38"/><rect x="250" y="470" width="18" height="46"/><rect x="500" y="466" width="60" height="50"/></g>
  <!-- plants -->
  <g fill="#33472f"><ellipse cx="920" cy="700" rx="110" ry="150"/><rect x="884" y="770" width="72" height="90" fill="#6f5e46"/></g>
  <g fill="#2f3f2d"><ellipse cx="120" cy="740" rx="80" ry="120"/><rect x="92" y="800" width="56" height="70" fill="#6f5e46"/></g>
  <!-- light pool on floor -->
  <ellipse cx="1200" cy="900" rx="260" ry="60" fill="#f4ead0" opacity=".4"/>
  <rect width="1600" height="1200" filter="url(#lbGrain)"/>
</svg>
