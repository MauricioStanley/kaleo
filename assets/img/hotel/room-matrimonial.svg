<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Habitacion Matrimonial de Kaleo con cama Queen y rincon de estar frente al jardin">
  <defs>
    <linearGradient id="r3Wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe8d8"/><stop offset="1" stop-color="#ddd4bf"/></linearGradient>
    <linearGradient id="r3Floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b79a"/><stop offset="1" stop-color="#a08c6c"/></linearGradient>
    <linearGradient id="r3Win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6bd9f"/><stop offset="1" stop-color="#5c7a56"/></linearGradient>
    <radialGradient id="r3Glow" cx="50%" cy="10%" r="90%"><stop offset="0" stop-color="#f6ecd2" stop-opacity=".7"/><stop offset="1" stop-color="#f6ecd2" stop-opacity="0"/></radialGradient>
    <filter id="r3Grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#r3Wall)"/>
  <rect x="0" y="850" width="1600" height="350" fill="url(#r3Floor)"/>
  <rect x="0" y="845" width="1600" height="10" fill="#8f7c5d"/>
  <!-- large window right -->
  <rect x="1080" y="150" width="470" height="600" fill="url(#r3Win)"/>
  <rect x="1080" y="150" width="470" height="600" fill="none" stroke="#cec5ad" stroke-width="18"/>
  <line x1="1315" y1="150" x2="1315" y2="750" stroke="#cec5ad" stroke-width="10"/>
  <line x1="1080" y1="450" x2="1550" y2="450" stroke="#cec5ad" stroke-width="10"/>
  <rect x="1080" y="150" width="470" height="600" fill="url(#r3Glow)"/>
  <!-- queen bed -->
  <rect x="180" y="400" width="640" height="230" rx="14" fill="#c3b291"/>
  <rect x="150" y="610" width="720" height="250" fill="#f3efe4"/>
  <path d="M150 610 h720 v78 q-360 40 -720 0 z" fill="#e6dfce"/>
  <rect x="180" y="690" width="300" height="96" rx="12" fill="#dbd3bf"/>
  <rect x="500" y="690" width="300" height="96" rx="12" fill="#dbd3bf"/>
  <rect x="150" y="850" width="720" height="26" fill="#8f7c5d"/>
  <!-- nightstands + lamps -->
  <rect x="70" y="700" width="90" height="160" fill="#7d6a51"/>
  <rect x="880" y="700" width="90" height="160" fill="#7d6a51"/>
  <path d="M95 610 l40 0 14 90 -68 0 z" fill="#e9dcc0"/>
  <path d="M905 610 l40 0 14 90 -68 0 z" fill="#e9dcc0"/>
  <!-- armchair by window -->
  <path d="M1120 640 q-20 -140 120 -150 q140 10 120 150 z" fill="#4c6449"/>
  <rect x="1120" y="640" width="240" height="120" rx="16" fill="#3f5540"/>
  <rect x="1150" y="750" width="20" height="90" fill="#5f5039"/>
  <rect x="1320" y="750" width="20" height="90" fill="#5f5039"/>
  <!-- plant + rug light -->
  <g fill="#33472f"><ellipse cx="1010" cy="770" rx="80" ry="110"/><rect x="982" y="830" width="56" height="70" fill="#6f5e46"/></g>
  <ellipse cx="1220" cy="950" rx="280" ry="60" fill="#f4ead0" opacity=".4"/>
  <rect width="1600" height="1200" filter="url(#r3Grain)"/>
</svg>
